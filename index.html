<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的云端工作台</title>
<style>
  :root{--bg:#f5f1ea;--card:#fff;--ink:#2b2722;--muted:#8a8175;--line:#ebe4d8;
    --accent:#d64a3a;--accent-soft:#fbe9e6;--green:#3a9d6e;--blue:#3a78c2}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);padding:18px;max-width:560px;margin:0 auto}
  h1{font-size:22px;margin:6px 0 2px;color:var(--accent)}
  .sub{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.6}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;
    text-decoration:none;color:var(--ink);display:block;transition:.15s}
  .card:active{filter:brightness(.97)}
  .card .ico{font-size:26px}
  .card .t{font-size:15px;font-weight:700;margin-top:8px}
  .card .d{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}
  .card.ext{background:linear-gradient(135deg,#eef4ff,#f6f1ff)}
  .card.disabled{opacity:.6;pointer-events:none;background:#f3efe9;color:var(--muted)}
  .card.disabled .d{color:#a89e90}
  .foot{font-size:11px;color:var(--muted);margin-top:18px;text-align:center;line-height:1.6}
</style>
</head>
<body>
  <h1>我的云端工作台</h1>
  <div class="sub">内容数据库的前端入口 · 后端跑在腾讯云函数（SCF），手机随手就能用。</div>

  <div class="grid">
    <a class="card" href="./采集.html">
      <div class="ico">☁️</div>
      <div class="t">云端素材采集</div>
      <div class="d">甩链接 / 贴正文 → 自动分类入库</div>
    </a>
    <a class="card" href="./干货.html">
      <div class="ico">📚</div>
      <div class="t">干货采集</div>
      <div class="d">存原文 + 来源，分类可 AI</div>
    </a>
    <a class="card" href="./内核.html">
      <div class="ico">🧠</div>
      <div class="t">认知内核沉淀</div>
      <div class="d">提炼世界观 / 价值观引擎</div>
    </a>
    <a class="card ext" href="https://karie622.github.io/mind-watch/" target="_blank" rel="noopener">
      <div class="ico">🧭</div>
      <div class="t">思维监控</div>
      <div class="d">记录念头 / 循环提醒 →</div>
    </a>
    <a class="card disabled" href="#">
      <div class="ico">📖</div>
      <div class="t">微信读书</div>
      <div class="d">本地运行 · 在家电脑打开（不上云端）</div>
    </a>
  </div>

  <div class="foot">所有数据由你的云端后端（Tencent SCF）读写 · GitHub Pages 仅托管前端</div>
</body>
</html>

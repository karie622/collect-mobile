<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>云端素材采集</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--line:#e5e7eb;--ink:#1f2328;--sub:#6b7280;--accent:#2563eb;--soft:#eff6ff}
*{box-sizing:border-box}
body{margin:0;padding:14px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink)}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:17px;margin:0 0 4px}
.sub{font-size:12.5px;color:var(--sub);margin-bottom:14px;line-height:1.7}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{font-size:12.5px;color:var(--sub);display:block;margin-bottom:5px;font-weight:600}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;
  font-size:14px;background:#fff;color:var(--ink);outline:none;font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:150px;resize:vertical;line-height:1.6}
.row{display:flex;gap:8px;align-items:stretch}
.btn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#fff;
  font-size:14.5px;font-weight:700;cursor:pointer;margin-top:10px}
.btn:disabled{opacity:.55}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);flex:0 0 auto;
  width:auto;padding:10px 16px;margin-top:0;font-weight:600}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;text-align:center;padding:10px;border-radius:10px;background:var(--panel);
  border:1px solid var(--line);font-size:13.5px;cursor:pointer}
.tab.active{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.status{font-size:12.5px;padding:9px 12px;border-radius:9px;margin-bottom:12px;line-height:1.6}
.status.ok{background:#e8f5ee;color:#1f7a4d}
.status.err{background:#fdecea;color:#b23b2e}
.status.wait{background:#fff4e5;color:#a5621a}
.msg{padding:11px 13px;border-radius:10px;font-size:13px;margin-top:10px;display:none;line-height:1.7}
.msg.ok{background:#e8f5ee;color:#1f7a4d}
.msg.err{background:#fdecea;color:#b23b2e}
.msg code{background:rgba(0,0,0,.06);padding:1px 6px;border-radius:5px;font-size:12px}
.hintbox{font-size:12px;color:var(--sub);line-height:1.8;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px}
.recent{font-size:13px;max-height:340px;overflow:auto}
.recent .it{padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.recent .it:last-child{border-bottom:none}
.recent .delbtn{margin-left:6px;background:#fff;border:1px solid #e3b5b0;color:#b23b2e;border-radius:6px;padding:1px 7px;font-size:12px;cursor:pointer;vertical-align:middle}
.recent .delbtn:hover{background:#fbe9e7}
.recent .delbtn:disabled{opacity:.5;cursor:default}
.recent .t{font-weight:600;line-height:1.45}
.recent .m{font-size:11.5px;color:var(--sub);margin-top:2px}
.recent .x{font-size:12px;color:var(--sub);line-height:1.75;margin-top:6px;display:none;
  white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:8px 10px}
.nav{display:block;text-align:center;text-decoration:none;color:var(--accent);
  font-size:13.5px;padding:11px;border:1px solid var(--line);border-radius:11px;
  background:var(--panel);margin-top:10px}
.nav span{display:block;color:var(--sub);font-size:11.5px;margin-top:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>☁️ 云端素材采集</h1>
  <div class="sub">手机任何网络都能用，不需要电脑开机、不需要梯子。<br>甩链接 → 自动抓正文 → AI 分类 → 存进你的云端存储（Railway）。</div>

  <div style="margin-bottom:10px"><a href="https://karie622.github.io/mind-watch/" target="_blank" rel="noopener" style="font-size:13px;color:var(--accent);text-decoration:none;font-weight:600">🧭 思维监控（记录念头 / 循环提醒）→</a></div>

  <a class="nav" href="./index.html" style="background:#eef4ff;border-color:#dbe7ff;color:#3a78c2">← 返回首页</a>

  <div class="status wait" id="conn">正在检测云端服务…</div>

  <div class="card">
    <label>服务地址（自动识别，无需填写）</label>
    <div class="row">
      <input id="api" placeholder="https://xxx.up.railway.app" style="flex:1">
      <button class="btn ghost" onclick="saveApi()">保存</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-url" onclick="switchTab('url')">🔗 甩链接</div>
    <div class="tab" id="tab-paste" onclick="switchTab('paste')">✎ 粘贴正文</div>
  </div>

  <div class="card" id="m-url">
    <label>文章链接（微信 / 知乎 / 任意网页）</label>
    <input id="u-url" placeholder="粘贴文章链接">
    <label style="margin-top:10px">类别（选了就一定归到这类）</label>
    <select id="u-hint">
      <option value="">自动判断</option>
      <option>社会观察</option><option>内在修行</option><option>人际关系</option>
      <option>能力提升</option><option>健康管理</option><option>效率提升</option>
    </select>
    <button class="btn" onclick="submitUrl()">抓取并入库</button>
  </div>

  <div class="card" id="m-paste" style="display:none">
    <label>标题（可留空，自动取首行）</label>
    <input id="p-title" placeholder="给这条素材起个名">
    <label style="margin-top:10px">正文</label>
    <textarea id="p-content" placeholder="粘贴文章正文，或直接写下你的想法…"></textarea>
    <label style="margin-top:10px">类别</label>
    <select id="p-hint">
      <option value="">自动判断</option>
      <option>社会观察</option><option>内在修行</option><option>人际关系</option>
      <option>能力提升</option><option>健康管理</option><option>效率提升</option>
    </select>
    <button class="btn" onclick="submitPaste()">直接入库</button>
  </div>

  <div class="msg" id="msg"></div>

  <div class="card">
    <label>最近入库 <span id="recent-count" style="font-weight:400"></span></label>
    <div class="recent" id="recent">加载中…</div>
    <button class="btn ghost" style="width:100%;margin-top:10px" onclick="loadRecent()">刷新列表</button>
  </div>

  <a class="nav" id="nav-reader" href="./干货.html">
    📚 打开干货采集<span id="nav-reader-tip">分类浏览 / 搜索</span>
  </a>
  <a class="nav" id="nav-workbench" href="./内核.html">
    🧠 打开认知内核<span id="nav-workbench-tip">个人认知飞轮引擎</span>
  </a>

  <div class="hintbox">
    <b>使用提示</b><br>
    · 本页托管在云端，打开即自动连接，无需填地址<br>
    · 微信文章若抓取异常，改用「✎ 粘贴正文」最稳<br>
    · 入库位置：云端存储 → 分类库/&lt;类别&gt;/xxx.md
  </div>
</div>

<script>
function $(id){return document.getElementById(id);}
var BUSY=false;

// ===== API 地址自动识别（与 index.html 一致）=====
const DEFAULT_API='https://1488221122-fm448vw4ra.ap-beijing.tencentscf.com';
const API_BASE=(function(){
  const norm=u=>(u||'').trim().replace(/\/+$/,'');
  try{                                  // ?api=https://xxx 显式覆盖，并记住
    const q=norm(new URLSearchParams(location.search).get('api'));
    if(q){localStorage.setItem('cdb_api_base',q);return q;}
  }catch(e){}
  try{
    const s=norm(localStorage.getItem('cdb_api_base'));
    if(s)return s;
  }catch(e){}
  // 本页不是由腾讯云函数域提供时（如 GitHub Pages / 本地直开），默认指向云端后端；
  // 同源部署时留空走相对路径。
  const h=(location.hostname||'').toLowerCase();
  return h.endsWith('tencentscf.com')?'':DEFAULT_API;
})();
function base(){ return API_BASE; }

function setStatus(t,txt){ $('conn').className='status '+t; $('conn').textContent=txt; }
function fetchTO(u,opt){opt=opt||{};var c=new AbortController();var t=setTimeout(function(){c.abort();},opt.to||8000);
  return fetch(u,Object.assign({},opt,{signal:c.signal})).then(function(r){clearTimeout(t);return r;},
    function(e){clearTimeout(t);throw e;});}
function esc(s){return (s||'').replace(/[&<>]/g,function(m){
  return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m];});}
function showMsg(t,html){var m=$('msg');m.className='msg '+t;m.innerHTML=html;m.style.display='block';}
function hideMsg(){$('msg').style.display='none';}
function setBusy(b){BUSY=b;document.querySelectorAll('.btn').forEach(function(x){x.disabled=b;});}

function saveApi(){
  var v=$('api').value.trim().replace(/\/+$/,'');
  if(!v){setStatus('err','请先填写服务地址');return;}
  localStorage.setItem('cdb_api_base',v);
  location.reload();
}
function loadApi(){
  var b=API_BASE;
  $('api').value=b;
  $('nav-reader').href='./干货.html';
  $('nav-workbench').href='./内核.html';
  $('nav-reader-tip').textContent='分类浏览 / 搜索';
  $('nav-workbench-tip').textContent='个人认知飞轮引擎';
  check();
}
async function check(){
  var b=base();
  if(!b){setStatus('wait','请先填写服务地址并点「保存」');return;}
  setStatus('wait','正在检测云端服务…');
  try{
    var r=await fetchTO(b+'/api/ping',{to:8000});
    var j=await r.json();
    if(j && j.ok){
      var s='● 已连接'+(j.ai?'（AI 分类已启用）':'（未配 AI Key，仅规则粗分）');
      if(j.storage) s+=' · 存储 '+j.storage;
      setStatus('ok',s);
    }else throw 0;
  }catch(e){
    var bad=e&&e.name==='AbortError';
    setStatus('err',bad
      ? '● 连接超时：该地址当前网络直连不通。请确认服务已部署且地址正确'
      : '● 连不上服务，请检查地址是否正确、是否已部署');
  }
}
function switchTab(m){
  $('m-url').style.display=(m==='url')?'':'none';
  $('m-paste').style.display=(m==='paste')?'':'none';
  $('tab-url').className='tab'+(m==='url'?' active':'');
  $('tab-paste').className='tab'+(m==='paste'?' active':'');
}

async function submitUrl(){
  hideMsg();
  var url=$('u-url').value.trim();
  if(!url){showMsg('err','请先粘贴文章链接。');return;}
  await post({url:url,category_hint:$('u-hint').value},'抓取并入库完成');
  $('u-url').value='';
}
async function submitPaste(){
  hideMsg();
  var c=$('p-content').value.trim();
  if(!c){showMsg('err','请先粘贴正文。');return;}
  await post({title:$('p-title').value.trim(),content:c,category_hint:$('p-hint').value},'已入库');
  $('p-content').value=''; $('p-title').value='';
}
async function loadRecent(){
  var box=$('recent'); var b=base();
  if(!b){ box.innerHTML='<div class="m">请先填写并保存服务地址。</div>'; return; }
  box.innerHTML='加载中…';
  try{
    var r=await fetchTO(b+'/api/list',{to:12000});
    var j=await r.json();
    var items=(j&&j.items)||[];
    $('recent-count').textContent='（共 '+items.length+' 条）';
    if(!items.length){ box.innerHTML='<div class="m">云端还没有素材，先采集一条试试。</div>'; return; }
    box.innerHTML=items.map(function(it,i){
      return '<div class="it" onclick="toggleItem('+i+')">'
        +'<div class="t">'+esc(it.title||'(无标题)')+'</div>'
        +'<div class="m">'+esc(it.category||'')
        +' · '+esc((it.collected_at||'').slice(0,16))
        +(it.ai_refined==='yes'?' · AI 精修':'')
        +' <button class="delbtn" data-id="'+esc(it.id||'')+'" onclick="event.stopPropagation();delItem(this)">🗑 删</button></div>'
        +'<div class="x" id="x-'+i+'" data-id="'+esc(it.id||'')+'"></div></div>';
    }).join('');
  }catch(e){
    box.innerHTML='<div class="m" style="color:#b23b2e">读取失败：'+esc(e.message)+'</div>';
  }
}
async function toggleItem(i){
  var x=$('x-'+i); if(!x) return;
  if(x.style.display==='block'){ x.style.display='none'; return; }
  x.textContent='读取中…'; x.style.display='block';
  try{
    var r=await fetchTO(base()+'/api/item?id='+encodeURIComponent(x.getAttribute('data-id')),{to:12000});
    var j=await r.json();
    x.textContent=(j.content||'（无正文）').slice(0,2000);
  }catch(e){ x.textContent='读取失败：'+e.message; }
}
async function delItem(btn){
  var id=btn.getAttribute('data-id'); if(!id) return;
  var item=btn.closest('.it');
  var title=item?item.querySelector('.t').textContent:'(未知标题)';
  if(!confirm('确定删除《'+title+'》？删除后不可恢复。')) return;
  btn.disabled=true; btn.textContent='删除中…';
  try{
    var r=await fetchTO(base()+'/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id}),to:15000});
    var j=await r.json();
    if(j&&j.ok){ loadRecent(); }
    else{ alert('删除失败：'+(j&&j.error||'未知错误')); btn.disabled=false; btn.textContent='🗑 删'; }
  }catch(e){ alert('删除失败：'+e.message); btn.disabled=false; btn.textContent='🗑 删'; }
}

async function post(d,okText){
  var b=base();
  if(!b){showMsg('err','请先填写并保存服务地址。');return;}
  if(BUSY){showMsg('err','正在提交中，请勿重复点击。');return;}
  setBusy(true);
  try{
    var r=await fetchTO(b+'/api/ingest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d),to:30000});
    var j=await r.json();
    if(!r.ok||!j.ok){showMsg('err','✗ '+(j.error||('请求失败 '+r.status)));return;}
    var tag=j.ai_refined?'（AI 精修）':'（规则粗分）';
    showMsg('ok','✓ '+okText+'：<b>'+esc(j.category)+'</b> '+tag
      +'<br>标题：'+esc(j.title||'')+'<br>已存入：<code>'+esc(j.path)+'</code>');
    loadRecent();
  }catch(e){
    showMsg('err','✗ 网络错误：'+e.message);
  }finally{setBusy(false);}
}

loadApi();
loadRecent();
</script>
</body>
</html>

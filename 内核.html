<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>手动选题 · 认知内核升级（云端版）</title>
<style>
  :root{
    --primary:#6c5ce7; --primary-d:#5849c2; --brand:#e0457b; --ok:#2f855a;
    --warn:#d9822b; --bg:#f4f5fb; --card:#fff; --mut:#8b95a5; --line:#eceef5;
    --txt:#2b2f3a; --mut2:#6b7a8d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}
  .wrap{max-width:780px;margin:0 auto;padding:18px 14px 60px}
  .banner{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;font-size:12.5px;display:flex;align-items:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:#bbb;flex:0 0 auto}
  .dot.on{background:var(--ok)} .dot.off{background:#e03131}
  h1{font-size:18px;margin:18px 2px 4px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .back{font-size:12.5px;color:var(--primary-d);text-decoration:none;border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:8px;white-space:nowrap}
  .sub{color:var(--mut2);font-size:12.5px;margin:0 2px 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(40,40,80,.04)}
  .card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .card h2 .tag{font-size:11px;font-weight:500;color:#fff;background:var(--primary);padding:2px 8px;border-radius:20px}
  label{display:block;font-size:12.5px;color:var(--mut2);margin:10px 0 4px}
  input[type=text],textarea,select{width:100%;border:1px solid #dfe3ee;border-radius:9px;padding:9px 11px;font-size:13.5px;font-family:inherit;background:#fcfcfe;color:var(--txt)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);background:#fff}
  textarea{resize:vertical;line-height:1.7}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>div{flex:1;min-width:140px}
  .dims{display:grid;grid-template-columns:1fr;gap:8px;margin-top:6px}
  .dim{display:flex;align-items:center;gap:8px;font-size:12.5px}
  .dim span{flex:0 0 5.2em;color:var(--mut2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dim input[type=range]{flex:1;min-width:90px;accent-color:var(--primary)}
  .dim b{flex:0 0 1.2em;text-align:right;color:var(--primary);font-size:12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .primary{background:var(--primary);color:#fff}
  .primary:hover{background:var(--primary-d)}
  .ghost{background:#eef0fa;color:var(--primary-d)}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .syncbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#f2f1fe;border:1px solid #e4e1fb;border-radius:11px;padding:11px 13px;margin-top:10px}
  .sync-status{font-size:12.5px;color:var(--mut2)}
  .sync-status.ok{color:var(--ok);font-weight:600}
  .sync-status.err{color:#e03131}
  .meta{font-size:12px;color:var(--mut2);background:#f7f8fc;border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin-top:10px}
  .meta b{color:var(--txt)}
  .report{display:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
  .rep-sum{font-size:13.5px;background:#fafbfe;border-left:3px solid var(--primary);border-radius:8px;padding:10px 13px}
  .list-h{font-size:13px;font-weight:700;margin:12px 0 6px}
  .list-h.ok{color:var(--ok)} .list-h.rv{color:var(--warn)} .list-h.ad{color:var(--brand)}
  .item{border-left:3px solid #ccc;background:#fafbfe;border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:13px;line-height:1.7}
  .item .mut{color:var(--mut2);font-size:12px}
  .item .src{color:#8b95a5;font-size:12px}
  .err{color:#e03131;font-size:12.5px;min-height:16px;margin-top:6px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#2b2f3a;color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .warn-box{background:#fff4f4;border:1px solid #ffc9c9;color:#c92a2a;border-radius:9px;padding:9px 12px;font-size:12.5px;line-height:1.7;margin-bottom:10px}
  .pill{display:inline-block;background:#eef0fa;color:var(--primary-d);font-size:11px;padding:1px 8px;border-radius:20px;margin-left:4px}
  .synced{list-style:none;padding:0;margin:10px 0 0;font-size:12.5px}
  .synced li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
  .synced li:last-child{border-bottom:none}
  .synced .s{color:var(--ok);flex:0 0 auto}
  .hint{font-size:11.5px;color:var(--mut);margin:3px 0 0}
</style>
</head>
<body>
<div class="banner">
  <span class="dot" id="statusDot"></span>
  <span id="statusTxt">检测中…</span>
</div>

<div class="wrap">
  <h1>🧠 手动选题 · 认知内核升级 <a class="back" href="index.html">← 返回首页</a></h1>
  <p class="sub" id="subHint"></p>

  <!-- ============ 模块一：手动选题 ============ -->
  <div class="card">
    <h2><span class="tag" style="background:var(--brand)">模块一</span> 手动选题（同步到云端选题库）</h2>

    <label>选题标题 *</label>
    <input type="text" id="t-title" placeholder="例如：为什么你越努力越焦虑">

    <div class="row" style="margin-top:6px">
      <div>
        <label>目标平台</label>
        <select id="t-platform">
          <option>公众号</option>
          <option>知乎</option>
          <option>小红书</option>
        </select>
      </div>
      <div>
        <label>一句话立意</label>
        <input type="text" id="t-hook" placeholder="可留空，之后可 AI 补">
      </div>
    </div>

    <label>六维潜力打分（默认 3 星，可拖动）</label>
    <div class="dims" id="dims"></div>

    <details>
      <summary>素材三分层（可选，供后续大纲/成文参考）</summary>
      <label>① 核心证据（1级支撑）</label>
      <textarea id="t-mat1" rows="3" placeholder="最能撑起这个选题的事实/数据/案例"></textarea>
      <label>② 补充视角（2级）</label>
      <textarea id="t-mat2" rows="2" placeholder="补充角度"></textarea>
      <label>③ 对抗靶子（3级·反方）</label>
      <textarea id="t-mat3" rows="2" placeholder="常见反对意见，用来做认知升级"></textarea>
    </details>

    <div class="syncbar">
      <button class="btn primary" id="btnSyncCloud" onclick="syncAllToCloud()">☁️ 推送到云端选题库</button>
      <span class="sync-status" id="cloudStatus">未同步</span>
    </div>
    <div class="hint" style="margin-top:6px">选题会同步到云端（腾讯云函数），换设备打开本页数据仍在。若条目多或从别的设备回来，点上面的按钮可把本机选题重新推送合并到云端。</div>

    <div class="btnrow" style="margin-top:12px">
      <button class="btn primary" onclick="addTopic()">➕ 加入选题库并同步</button>
      <button class="btn ghost" onclick="resetTopicForm()">清空</button>
    </div>
    <div class="err" id="tErr"></div>

    <div class="meta" id="tMeta">本机选题库：<b>读取中…</b></div>
    <ul class="synced" id="syncList"></ul>
  </div>

  <!-- ============ 模块二：认知内核升级 ============ -->
  <div class="card">
    <h2><span class="tag">模块二</span> 认知内核升级（增量迭代）</h2>

    <div class="row">
      <div>
        <label>DeepSeek Key</label>
        <input type="text" id="dsKey" placeholder="sk-..." autocomplete="off">
      </div>
      <div style="flex:0 0 200px">
        <label>模型</label>
        <select id="dsModel">
          <option value="deepseek-v4-flash">deepseek-v4-flash</option>
        </select>
      </div>
    </div>
    <div class="hint">Key 仅存本机浏览器 localStorage，不上传代码或云端。</div>

    <div class="row" style="margin-top:10px">
      <div>
        <label>迭代素材</label>
        <select id="itSources">
          <option value="mind_new">仅新增想通瞬间（默认·增量）</option>
          <option value="mind_all">全部想通瞬间</option>
          <option value="all">含原创文章</option>
        </select>
      </div>
      <div style="flex:0 0 150px;display:flex;align-items:flex-end">
        <button class="ghost" style="width:100%" onclick="resetConsumed()">↺ 重置已消化</button>
      </div>
    </div>

    <div class="meta" id="kMeta">当前内核：<b>读取中…</b></div>

    <div class="btnrow">
      <button class="btn primary" id="btnIterate" onclick="iterate()">🔄 开始认知迭代</button>
    </div>
    <div class="err" id="itErr"></div>

    <div class="report" id="itReport">
      <div id="itSummary" class="rep-sum"></div>
      <div id="itLists"></div>
      <label style="margin-top:10px">建议的新内核全文（可手改后再采纳）</label>
      <textarea id="itKernel" rows="12"></textarea>
      <div class="btnrow">
        <button class="btn primary" id="btnApply" onclick="applyIterate()">✓ 采纳并更新内核</button>
        <button class="btn ghost" onclick="discardIterate()">放弃</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- 云端 API 基址（与采集/干货页同一套逻辑） ---------- */
const SCF = "https://1488221122-fm448vw4ra.ap-beijing.tencentscf.com";
function apiBase(){
  try{
    const q = new URLSearchParams(location.search).get("api");
    if(q){ localStorage.setItem("cdb_api", q); return q.replace(/\/+$/, ""); }
    const saved = localStorage.getItem("cdb_api");
    if(saved) return saved.replace(/\/+$/, "");
  }catch(e){}
  const h = location.hostname;
  if(h === "localhost" || h === "127.0.0.1" || h.indexOf("tencentscf") >= 0) return "";
  return SCF;
}
function api(p){ return apiBase() + p; }

/* ---------- 常量（与自媒体工作台保持一致） ---------- */
const KEY="wb_workbench_v1";
const KKEY="cdb_ds_key";
const DIMS=[
  {k:"反常识强度"},{k:"身份对比张力"},{k:"认知升级纯度"},
  {k:"社交货币"},{k:"情绪钩子"},{k:"案例可信度"}
];

const $ = s=>document.querySelector(s);
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),2600);}

/* ---------- 在线状态 ---------- */
let online=false;
function setOnline(v){
  online=v;
  $("#statusDot").className="dot "+(v?"on":"off");
  $("#statusTxt").textContent=v
    ? "已连接云端服务（可迭代内核 / 同步选题）"
    : "未连接云端服务：请检查网络后刷新，或在链接后加 ?api=<服务地址> 重试";
}
async function detectOnline(){
  try{
    const r=await fetch(api("/api/kernel"),{cache:"no-store"});
    setOnline(r.ok||r.status===400);
  }catch(e){ setOnline(false); }
}

/* ---------- 选题：六维 ---------- */
function renderDims(){
  $("#dims").innerHTML=DIMS.map(dm=>
    `<div class="dim"><span>${dm.k}</span><input type="range" min="0" max="5" step="1" value="3" data-dim="${dm.k}"><b>3</b></div>`
  ).join("");
  $("#dims").querySelectorAll('input[type=range]').forEach(inp=>{
    inp.addEventListener("input",()=>{ inp.nextElementSibling.textContent=inp.value; });
  });
}
function readDims(){const d={};DIMS.forEach(dm=>{d[dm.k]=parseFloat($(`[data-dim="${dm.k}"]`).value)||0;});return d;}
function starOf(d){const w={ "反常识强度":.20,"身份对比张力":.18,"认知升级纯度":.18,"社交货币":.17,"情绪钩子":.14,"案例可信度":.13 };let s=0;DIMS.forEach(dm=>{s+=(d[dm.k]/5)*w[dm.k];});return Math.round(s*5*10)/10;}

/* ---------- 选题：uid ---------- */
function uid(){
  const raw=localStorage.getItem(KEY);
  if(raw){ try{ const st=JSON.parse(raw); st.seq=(st.seq||0)+1; localStorage.setItem(KEY,JSON.stringify(st)); return "T"+String(st.seq).padStart(4,"0"); }catch(e){} }
  return "T"+Date.now().toString().slice(-6);
}

/* ---------- 模块一：加入并同步 ---------- */
function resetTopicForm(){
  $("#t-title").value="";$("#t-hook").value="";
  $("#t-mat1").value="";$("#t-mat2").value="";$("#t-mat3").value="";
  $("#dims").querySelectorAll('input[type=range]').forEach(i=>{i.value=3;i.nextElementSibling.textContent="3";});
}
function fmtTime(ts){
  if(!ts) return "—";
  const d=new Date(ts), p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function renderCloudStatus(info){
  const el=$("#cloudStatus");
  if(!el) return;
  if(info.err){ el.textContent="云端读取失败："+info.err; el.className="sync-status err"; return; }
  if(info.ok===false){ el.textContent="未同步"; el.className="sync-status"; return; }
  el.textContent=`已同步到云端 · ${info.count} 条 · ${fmtTime(info.ts)}`;
  el.className="sync-status ok";
}
async function addTopic(){
  const title=$("#t-title").value.trim();
  if(!title){ $("#tErr").textContent="请填写选题标题"; return; }
  $("#tErr").textContent="";
  const d=readDims();
  const t={
    id:uid(), title,
    platform:$("#t-platform").value,
    hook:$("#t-hook").value.trim(),
    material_level1:$("#t-mat1").value.trim().slice(0,2000),
    material_level2:$("#t-mat2").value.trim().slice(0,2000),
    material_level3:$("#t-mat3").value.trim().slice(0,2000),
    dims:d, star:starOf(d), prevStar:null, status:"灵感",
    source:"云端轻量页", real:null, createdAt:new Date().toISOString().slice(0,10)
  };
  const res=await syncTopicToWorkbench(t);
  let msg="✅ 已加入选题库";
  if(res.localOk) msg+="（本机已写入）";
  if(res.cloudOk) msg+="（云端已同步）";
  if(!res.localOk && !res.cloudOk) msg="⚠️ 本地与云端都没同步成功，请检查网络";
  if(!res.cloudOk && res.localOk) msg+=" · 云端同步失败，已留本机";
  toast(msg);
  refreshTopicMeta();
  if(res.cloudOk) renderCloudStatus({ok:true, count:(res.merged||[]).length, ts:Date.now()});
  resetTopicForm();
}
/* 安全同步：本机只合并进已有 state；云端先取现有列表、去重后再整体回写（不丢其它选题） */
async function syncTopicToWorkbench(t){
  let localOk=false;
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const st=JSON.parse(raw)||{};
      if(!Array.isArray(st.topics)) st.topics=[];
      if(!st.topics.some(x=>x.title&&x.title.trim()===t.title.trim())){
        st.topics.unshift(t);
        localStorage.setItem(KEY,JSON.stringify(st));
      }
      localOk=true;
    }
  }catch(e){}
  let cloudTopics=[];
  try{ const r=await fetch(api("/api/topics")); if(r.ok){ const d=await r.json(); cloudTopics=Array.isArray(d)?d:(d.topics||[]); } }catch(e){}
  const merged=[t, ...cloudTopics.filter(c=>!(c&&c.title&&c.title.trim()===t.title.trim()))];
  let cloudOk=false;
  try{
    const r=await fetch(api("/api/topics"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({topics:merged})});
    cloudOk=r.ok;
  }catch(e){}
  return {localOk,cloudOk,merged};
}
/* 把本机全部选题重新推送到云端（取云端现有 + 本机合并，避免互相覆盖） */
let syncingCloud=false;
async function syncAllToCloud(){
  if(syncingCloud) return;
  syncingCloud=true;
  const btn=$("#btnSyncCloud"); btn.disabled=true;
  const old=btn.textContent; btn.textContent="同步中…";
  try{
    const st=readTopicsState();
    const localTopics=Array.isArray(st.topics)?st.topics:[];
    let cloudTopics=[];
    try{ const r=await fetch(api("/api/topics")); if(r.ok){ const d=await r.json(); cloudTopics=Array.isArray(d)?d:(d.topics||[]);} }catch(e){}
    const merged=mergeTopics(localTopics, cloudTopics);
    const r=await fetch(api("/api/topics"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({topics:merged})});
    if(!r.ok) throw new Error("HTTP "+r.status);
    st.topics=merged; localStorage.setItem(KEY,JSON.stringify(st));
    localStorage.setItem(SYNC_LS, JSON.stringify({ts:Date.now(), count:merged.length}));
    renderCloudStatus({ok:true, count:merged.length, ts:Date.now()});
    refreshTopicMeta();
    toast("✅ 已推送 "+merged.length+" 条选题到云端选题库");
  }catch(e){
    renderCloudStatus({err:e.message||String(e)});
    toast("同步失败："+(e.message||e));
  }finally{ syncingCloud=false; btn.disabled=false; btn.textContent=old; }
}
/* 查看云端现有条数 */
async function pullCloudStatus(){
  try{
    const r=await fetch(api("/api/topics"));
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d=await r.json();
    const arr=Array.isArray(d)?d:(d.topics||[]);
    renderCloudStatus({ok:true, count:arr.length, ts:Date.now()});
  }catch(e){ renderCloudStatus({err:e.message||String(e)}); }
}
function refreshTopicMeta(){
  let n=0, recent=[];
  try{ const st=JSON.parse(localStorage.getItem(KEY)||"{}"); if(Array.isArray(st.topics)){ n=st.topics.length; recent=st.topics.slice(0,5);} }catch(e){}
  $("#tMeta").innerHTML="本机选题库：<b>"+n+"</b> 条 · 来源标记「云端轻量页」";
  if(recent.length){
    $("#syncList").innerHTML=recent.map(t=>`<li><span>${esc(t.title)}<span class="pill">${esc(t.platform||"")}</span></span><span class="s">★${t.star}</span></li>`).join("");
  }
}

/* ---------- 选题状态辅助 ---------- */
const SYNC_LS='lite_last_sync';
function readTopicsState(){
  try{ const st=JSON.parse(localStorage.getItem(KEY)||"{}"); if(!Array.isArray(st.topics)) st.topics=[]; return st; }
  catch(e){ return {seq:0, topics:[]}; }
}
function writeTopicsState(st){ localStorage.setItem(KEY,JSON.stringify(st)); }
function mergeTopics(local,remote){
  const map=new Map();
  (local||[]).concat(remote||[]).forEach(t=>{
    if(!t||!t.id) return;
    const cur=map.get(t.id);
    if(!cur){ map.set(t.id,t); return; }
    const a=String(t.updatedAt||t.createdAt||''), b=String(cur.updatedAt||cur.createdAt||'');
    if(a.localeCompare(b)>0) map.set(t.id,t);
  });
  return Array.from(map.values()).sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
}

/* ---------- 模块二：内核迭代 ---------- */
async function loadKernelMeta(){
  if(!online) return;
  try{
    const r=await fetch(api("/api/kernel"),{cache:"no-store"});
    if(r.ok){ const d=await r.json();
      if(d.exists){ $("#kMeta").innerHTML=`当前内核：<b>${esc(d.version||"?")}</b> · 更新于 ${esc(d.updated_at||"-")} · 核心观点 ${Array.isArray(d.corePoints)?d.corePoints.length:0} 条`; }
      else $("#kMeta").innerHTML="当前内核：<b>尚未创建</b>（请先保存一次内核）";
    }
  }catch(e){}
}
async function loadMindStat(){
  if(!online) return;
  try{
    const r=await fetch(api("/api/kernel/mind_consumed"),{cache:"no-store"});
    if(r.ok){ const d=await r.json();
      const base=$("#kMeta").innerHTML;
      $("#kMeta").innerHTML=base+` · 想通瞬间已消化 <b>${d.consumed||0}/${d.total||0}</b>`;
    }
  }catch(e){}
}
async function resetConsumed(){
  if(!online){ toast("离线，无法重置"); return; }
  if(!confirm("清空「已消化」账本？清空后全部想通瞬间会重新进入增量迭代。")) return;
  try{
    const r=await fetch(api("/api/kernel/mind_consumed"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"reset"})});
    if(r.ok){ toast("已重置想通瞬间消化账本"); await loadMindStat(); }
    else toast("重置失败");
  }catch(e){ toast("重置失败："+(e.message||e)); }
}

async function iterate(){
  const key=$("#dsKey").value.trim();
  $("#itErr").textContent="";
  if(!online){ toast("未连接云端服务"); $("#itErr").textContent="未连接云端服务，请检查网络后刷新"; return; }
  if(!key){ toast("请先填写 DeepSeek Key"); $("#dsKey").focus(); return; }
  const btn=$("#btnIterate");
  btn.disabled=true; btn.textContent="迭代研判中…（约 30-90 秒）";
  $("#itReport").style.display="none";
  const src=$("#itSources").value;
  try{
    const r=await fetch(api("/api/kernel/iterate"),{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({key, model:$("#dsModel").value.trim()||"deepseek-v4-flash", sources:src})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||("HTTP "+r.status));
    renderReport(d.report||{});
    $("#itReport").style.display="block";
    toast("迭代报告已生成，请审阅");
  }catch(e){
    let msg=e.message||String(e);
    if(msg.indexOf("Authentication")>=0||msg.indexOf("401")>=0) msg="Key 被 DeepSeek 拒绝（401）：检查是否有效/余额。";
    $("#itErr").textContent="迭代失败："+msg;
    toast("迭代失败，详见页面提示");
  }finally{ btn.disabled=false; btn.textContent="🔄 开始认知迭代"; }
}
function itItem(x,color){
  let h=`<div class="item" style="border-left-color:${color}"><b>${esc(x.point||x.new||"")}</b>`;
  if(x.old) h+=`<div class="mut">原判断：${esc(x.old)}</div>`;
  if(x.evidence) h+=`<div class="mut">依据：${esc(x.evidence)}</div>`;
  if(x.why) h+=`<div class="mut">理由：${esc(x.why)}</div>`;
  if(x.source) h+=`<div class="src">—— ${esc(x.source)}</div>`;
  return h+"</div>";
}
function renderReport(rep){
  $("#itSummary").innerHTML=(rep._truncated
    ? `<div class="warn-box">⚠️ <b>本次输出触顶被截断</b>：报告靠补齐 JSON 救回，【建议新内核】很可能不完整。<b>请勿直接采纳</b>——先核对下方新内核篇幅是否明显短于原内核；如偏短，减少素材后重跑。</div>`
    : "")+"<b>迭代总评：</b>"+esc(rep.summary||"（无）")
    + (rep.sources?(function(s){
        const art=s.articles_excluded?"原创文章 <b>已排除</b>":"原创文章 "+(s.articles||0)+" 篇";
        let mi="想通瞬间 <b>"+(s.mind_blocks!=null?s.mind_blocks:(s.mind_files||0))+"</b> 条";
        if(s.only_new) mi+="（均为新增；另有 "+(s.mind_consumed||0)+" 条已消化，未重复喂入）";
        else mi+="（全部 "+(s.mind_total||s.mind_blocks||0)+" 条）";
        return `<div class="mut" style="margin-top:5px">本次素材：${art} · ${mi} · 已过滤日常记录与错误思维清单</div>`;
      })(rep.sources):"");
  let html="";
  const rc=rep.reinforce||[],rv=rep.revise||[],ad=rep.add||[];
  if(rc.length){ html+=`<div class="list-h ok">✚ 强化（${rc.length}）—— 素材印证了内核</div>`; rc.forEach(x=>html+=itItem(x,"var(--ok)")); }
  if(rv.length){ html+=`<div class="list-h rv">⟳ 修订（${rv.length}）—— 素材与内核冲突</div>`; rv.forEach(x=>html+=itItem(x,"var(--warn)")); }
  if(ad.length){ html+=`<div class="list-h ad">★ 新增（${ad.length}）—— 内核尚未覆盖</div>`; ad.forEach(x=>html+=itItem(x,"var(--brand)")); }
  if(!html) html=`<div class="mut">本次素材没有产生强化/修订/新增建议。</div>`;
  $("#itLists").innerHTML=html;
  $("#itKernel").value=rep.suggested_kernel||"";
  window._lastReport=rep;
}
async function applyIterate(){
  const rep=window._lastReport;
  if(!rep||!rep.suggested_kernel){ toast("没有可采纳的报告"); return; }
  if(rep._truncated && !confirm("⚠️ 本次输出触顶被截断，建议的新内核可能不完整！\n仍要采纳会用残缺文本覆盖 kernel.md（旧版先备份）。确定？建议先放弃重跑。")) return;
  if(!confirm("采纳后：\n1. 备份当前内核到「认知内核备份」\n2. 用建议的新内核覆盖 kernel.md\n确定？")) return;
  const btn=$("#btnApply"); btn.disabled=true; btn.textContent="写入中…";
  try{
    const r=await fetch(api("/api/kernel/apply"),{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({suggested_kernel:$("#itKernel").value, summary:rep.summary||""})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||("HTTP "+r.status));
    const extra=(d.mind_consumed_added!=null)?`；本轮 ${d.mind_consumed_added} 条想通瞬间标记已消化（累计 ${d.mind_consumed_total||0} 条）`:"";
    toast("内核已更新到 "+(d.version||"新版本")+"（旧版备份："+(d.backup||"-")+"）"+extra);
    discardIterate(); await loadKernelMeta(); await loadMindStat();
  }catch(e){ $("#itErr").textContent="采纳失败："+(e.message||e); toast("采纳失败，详见页面提示"); }
  finally{ btn.disabled=false; btn.textContent="✓ 采纳并更新内核"; }
}
function discardIterate(){
  $("#itReport").style.display="none";
  $("#itSummary").innerHTML=""; $("#itLists").innerHTML=""; $("#itKernel").value="";
  window._lastReport=null;
}

/* ---------- 初始化 ---------- */
function init(){
  renderDims();
  $("#dsKey").value=localStorage.getItem(KKEY)||"";
  $("#dsKey").addEventListener("change",e=>localStorage.setItem(KKEY,e.target.value.trim()));
  $("#subHint").innerHTML = "任意网络下打开本页即可用（数据在腾讯云端）。手动选题同步进云端选题库；认知内核按「思维监控 · 想通瞬间」增量迭代。想通瞬间请在「思维监控」页记录。";
  try{
    const s=JSON.parse(localStorage.getItem(SYNC_LS)||"null");
    if(s&&s.ts) renderCloudStatus({ok:true, count:s.count||0, ts:s.ts});
  }catch(e){}
  detectOnline().then(async()=>{ if(online){ await loadKernelMeta(); await loadMindStat(); await pullCloudStatus(); } });
  refreshTopicMeta();
}
init();
</script>
